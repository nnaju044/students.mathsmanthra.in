<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>You're Offline — Maths Manthra</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1e2a8f"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { navy: '#1e2a8f' } } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; min-height: 100svh; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen px-6 text-center">

  <div class="max-w-sm mx-auto">
    <!-- Icon -->
    <div class="float mb-8">
      <div class="w-24 h-24 bg-brand-navy rounded-3xl mx-auto flex items-center justify-center shadow-2xl">
        <svg class="w-12 h-12 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M18.364 5.636a9 9 0 1 1-12.728 12.728A9 9 0 0 1 18.364 5.636z"/>
          <path d="M12 8v4m0 4h.01"/>
        </svg>
      </div>
    </div>

    <!-- Content -->
    <h1 class="text-3xl font-extrabold text-slate-900 mb-3">You're Offline</h1>
    <p class="text-slate-500 text-base leading-relaxed mb-8">
      It looks like you've lost your internet connection. Check your network and try again.
    </p>

    <!-- Retry button -->
    <button onclick="window.location.reload()"
            class="w-full py-4 bg-brand-navy text-white font-bold text-base rounded-2xl shadow-lg active:scale-95 transition-transform">
      Try Again
    </button>

    <p class="text-xs text-slate-400 mt-6">
      Maths Manthra Student Portal
    </p>
  </div>

</body>
</html>
